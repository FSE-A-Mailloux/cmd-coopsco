<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionnaire - Modification période</title>
  <link rel="stylesheet" href="../../assets/base.css">
</head>
<body class="mockup-screen">
  <div class="mockup-container">
    <header class="mockup-header">
      <div class="title-stack"><h1>Périodes - Modification</h1><p class="subtitle">Domaine gestionnaire - mise à jour d'une période existante</p></div>
      <span class="static-pill">Prévisualisation statique</span>
    </header>
    <section class="card">
      <div class="layout-2">
        <article>
          <div class="field"><label>Nom de période</label><input class="input" value="Rentrée 2026"></div>
          <div class="field"><label>Date début</label><input class="input" value="01/06/2026"></div>
          <div class="field"><label>Date fin</label><input class="input" value="30/09/2026"></div>
        </article>
        <article>
          <div class="field">
            <label>Statut période</label>
            <label class="toggle-control">
              <input type="checkbox">
              <span class="toggle-slider"></span>
              <span class="toggle-text">Non en cours (période passée ou en préparation)</span>
            </label>
          </div>
          <div class="field">
            <label>État d'ouverture</label>
            <label class="toggle-control">
              <input type="checkbox" disabled>
              <span class="toggle-slider"></span>
              <span class="toggle-text">Fermée (indisponible hors statut En cours)</span>
            </label>
          </div>
          <p class="muted">Règles: une seule période peut avoir le statut `En cours`. Une période `Non en cours` (passée ou en préparation) ne peut pas être `Ouverte`.</p>
        </article>
      </div>
      <section class="card">
        <h2 class="card-title">Cotisation de période</h2>
        <div class="layout-3">
          <div class="field"><label>Cotisation 1er enfant (EUR)</label><input class="input" value="12"></div>
          <div class="field"><label>Cotisation 2e enfant (EUR)</label><input class="input" value="8"></div>
          <div class="field"><label>Cotisation 3e enfant et suivants (EUR)</label><input class="input" value="5"></div>
        </div>
      </section>
      <div class="actions">
        <a class="button" href="./admin-periodes-detail.html">Annuler</a>
        <button class="button primary">Enregistrer les modifications</button>
      </div>
    </section>
  </div>
</body>
</html>
