<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Récupération d'accès</title>
  <link rel="stylesheet" href="../../assets/base.css">
</head>
<body class="mockup-screen">
  <div class="mockup-container">
    <header class="mockup-header">
      <div class="title-stack"><h1>Récupération d'accès</h1><p class="subtitle">Réinitialisation du mot de passe</p></div>
      <span class="static-pill">Prévisualisation statique</span>
    </header>
    <section class="card">
      <div class="field"><label>Email de connexion</label><input class="input" value="prénom.nom@coopsco.fr"></div>
      <div class="actions">
        <button class="button primary">Envoyer un lien</button>
        <button class="button">Retour à la connexion</button>
      </div>
      <p class="muted">Un lien de réinitialisation est envoyé si le compte existe.</p>
    </section>
  </div>
</body>
</html>
