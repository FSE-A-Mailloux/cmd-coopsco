version: "3.8"

services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: fsecoopeidam-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fsecoopeidam
    ports:
      - "3306:3306"
    volumes:
      - fsecoopeidam-mysql-data:/var/lib/mysql
      - ./mysql/fsecoopeidam_mysql_db.sql:/docker-entrypoint-initdb.d/01-fsecoopeidam.sql:ro
      - ./mysql/02-retirer-referentiel-fournisseur.sql:/docker-entrypoint-initdb.d/02-retirer-referentiel-fournisseur.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fsecoopeidam-mysql-data:
